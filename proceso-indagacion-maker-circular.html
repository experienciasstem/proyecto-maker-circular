<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proceso de indagación — Maker Circular</title>
<style>
  :root{
    --acento:#035C80; --navy:#1D3343; --amarillo:#FFCD02; --turquesa:#8DE2D6;
    --fondo:#F3F7F8; --texto:#1D3343;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:200px;overflow:hidden;background:transparent}
  body{font-family:"Archivo",Arial,Helvetica,sans-serif;color:var(--texto)}

  .banda{
    height:200px; width:100%;
    background:transparent;
    padding:18px 0;
    display:flex; align-items:center;
  }
  ol{
    list-style:none; width:100%;
    display:flex; align-items:flex-start; justify-content:space-between;
    position:relative;
  }
  ol::before{
    content:""; position:absolute; z-index:0;
    top:31px; left:5%; right:5%; height:4px; border-radius:2px;
    background:var(--turquesa);
  }
  li{
    position:relative; z-index:1;
    flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    opacity:0; transform:translateY(8px);
    animation:entra .45s ease forwards;
    animation-delay:calc(var(--i) * 90ms);
  }
  @keyframes entra{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){li{animation:none;opacity:1;transform:none}}

  .circulo{
    width:66px; height:66px; border-radius:50%;
    background:#fff; border:3px solid #035C80;
    display:grid; place-items:center;
    position:relative;
    transition:transform .2s ease, background .2s ease;
  }
  .circulo svg{width:30px;height:30px;stroke:#035C80;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .rotulo{
    margin-top:10px; padding:0 3px;
    font-size:14px; font-weight:700; line-height:1.15;
  }
  li:hover .circulo{transform:scale(1.08)}

  @media (max-width:900px){
    .banda{padding:16px 12px}
    .circulo{width:54px;height:54px}
    .circulo svg{width:24px;height:24px}
    ol::before{top:25px}
    .rotulo{font-size:12px}
  }
  @media (max-width:640px){
    .banda{padding:12px 8px}
    ol{flex-wrap:wrap; row-gap:10px}
    ol::before{display:none}
    li{flex:0 0 20%}
    .circulo{width:42px;height:42px;border-width:3px}
    .circulo svg{width:20px;height:20px}
    .rotulo{margin-top:5px;font-size:11px}
  }
</style>
</head>
<body>
<section class="banda" aria-label="Proceso de indagación en diez etapas">
  <ol>
    <li style="--i:0">
      <div class="circulo"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <p class="rotulo">Observar</p>
    </li>
    <li style="--i:1">
      <div class="circulo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></div>
      <p class="rotulo">Hacerse preguntas</p>
    </li>
    <li style="--i:2">
      <div class="circulo"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg></div>
      <p class="rotulo">Buscar información</p>
    </li>
    <li style="--i:3">
      <div class="circulo"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="8" height="16" rx="1"/><rect x="14" y="4" width="8" height="16" rx="1"/><path d="M4.5 8h3M4.5 11h3M16.5 8h3M16.5 11h3"/></svg></div>
      <p class="rotulo">Comparar fuentes</p>
    </li>
    <li style="--i:4">
      <div class="circulo"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></svg></div>
      <p class="rotulo">Analizar evidencias</p>
    </li>
    <li style="--i:5">
      <div class="circulo"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <p class="rotulo">Verificar</p>
    </li>
    <li style="--i:6">
      <div class="circulo"><svg viewBox="0 0 24 24"><path d="M12 22V12"/><path d="M12 12L6 6M12 12l6-6"/><path d="M3 6h4V2M21 6h-4V2"/></svg></div>
      <p class="rotulo">Tomar decisiones</p>
    </li>
    <li style="--i:7">
      <div class="circulo"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
      <p class="rotulo">Producir</p>
    </li>
    <li style="--i:8">
      <div class="circulo"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></div>
      <p class="rotulo">Revisar</p>
    </li>
    <li style="--i:9">
      <div class="circulo"><svg viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 5V5L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 8a5 5 0 0 1 0 8M20 5a9 9 0 0 1 0 14"/></svg></div>
      <p class="rotulo">Comunicar</p>
    </li>
  </ol>
</section>
</body>
</html>
